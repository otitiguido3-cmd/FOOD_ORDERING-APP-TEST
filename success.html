<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <link rel="stylesheet" href="tray.css">
    <link rel="stylesheet" href="order.css">
    <link rel="stylesheet" href="success.css">
    <link rel="stylesheet" href="dark_mode.css">



</head>

<body>
    <header class="main-header">
        <div class="toggle-menu">
           <a href="tray.html"><img src="images/back.png" alt="Back"></a> 
        </div>
        <div class="smart-food">
            <h3>ODERING</h3>
        </div>
        <div class="notification" aria-label="Notifications">
            <a href="notification.html"><img src="images/notification.png" alt="Notification"></a>
        </div>
       
    </header>

    <!-- BODY CONTENT -->
     <div class="order-confirmed">
        <div confirmation-image>
            <img src="images/delivered.png" alt="Order Confirmed">
        </div>
        <div confirmation-content>
            <h2 class="confitm_mssg">Order Confirmed!</h2>
            <p class="confitm_mssg">Thank you for your order </p><br>
            <p class="confitm_mssg">We've received it and will start preparing it shortly</p>
        </div>

     </div>
    
    <!-- STRUCTURING THE  MAIN CONTENT -->

    <section class="order-summary">
        <div class="free-delivery-content">
            <div class="deliver-now">
                <h4>Your Order</h4><br>
            </div>
            <div class="order-content">

                <!-- Shown only when there are NO items -->
                <div class="order-empty-state">
                    <div class="empty-state-content">
                        <img class="empty-order" src="images/no order.png" alt="No orders">
                        <p>No Order Yet 🍽️</p>
                    </div>
                </div>

                <!-- Food items will be inserted here -->
                <div class="order-items-list"></div>

            </div>

        </div>
        
    </section>

    <div class="tray-page-content tray-disabled">
        <div class="tray-actions">
           


            <section class="calculation">
                <div class="calculation-content">
                    <div class="sub-total">Subtotal:</div>
                    <div class="fee" name="fee">Ugx: 0</div>
                </div>
                <div class="calculation-content">
                    <div class="sub-total">Delivery Fee:</div>
                    <div class="fee" name="fee">Ugx: 0</div>
                </div>
                <div class="calculation-content">
                    <div class="sub-total">Service Fee:</div>
                    <div class="fee" name="fee">Ugx: 0</div>
                </div>
                <hr>
                <br>
                <div class="calculation-content">
                    <div class="sub-total">Total:</div>
                    <div class="fee" name="fee">Ugx: 0</div>
                </div>

                

            </section>
           
            <div class="estimated-delivery-time">
                <label for="estimated-delivery-time">We will keep you updated as your order progresses. You can track your order using the button below.</label>

            </div>

            <a href="#">
                <div class="track_order">
                    <label for="track_order_text" class="track_order_text">Track Order</label>

                </div>
            </a>
            <a href="index.html">
                <div class="back_to_home">
                    <label for="back_to_home_text" class="back_to_home_text">Back To Home</label>

                </div>
            </a>
            
        </div>
    </div>
    
    
     <!-- STRUCTURING THE FOOTER -->
   

    <footer>
        <nav>
            <ul>
                <li><a href="index.html"><img src="images/home.png" alt="Home"> <br> Home</a></li>
                <li><a href="menu.html"><img src="images/menu.png" alt="Menu"> <br> Menu</a></li>
                <li><a href="tray.html"><img src="images/tray.png" alt="Tray"> <br> Tray</a></li>
                <li><a href="orders.html"><img src="images/orders.png" alt="Orders"> <br> Orders</a></li>
                <li><a href="profile.html"><img src="images/profile.png" alt="Profile"> <br> Profile</a></li>
            </ul>
        </nav>
    </footer>

    <div class="side-menu-backdrop" id="side-menu-backdrop"></div>
    <div id="tray-toast" class="tray-toast" role="status" aria-live="polite"></div>
    <script src="main.js"></script>
    <script src="order.js"></script>
    <script src="dark_mode.js"></script>
</body>
</html>
